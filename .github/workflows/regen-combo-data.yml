name: Regenerate combo_data.json

on:
  push:
    branches:
      - master
    paths:
      - '*.xlsm'

permissions:
  contents: write

jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install openpyxl

      - name: Regenerate app/combo_data.json
        run: python app/data_loader.py

      - name: Commit regenerated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/combo_data.json
          if git diff --cached --quiet; then
            echo "No changes to combo_data.json"
          else
            git commit -m "Regenerate combo_data.json from updated .xlsm"
            git push
          fi
